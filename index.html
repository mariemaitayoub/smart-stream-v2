<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#1f2937]">
    <header class="flex justify-between items-center bg-[#111827] p-6  rounded-lg">

        <h1 class="text-[#ef4444] font-sans font-black text-2xl ">SMART <span class="text-[#f3f4f6]">STREAM</span></h1>
        <div class="flex justify-between">
            <img src="assets/images/profile.png" alt="profile" class="w-12 h-12 rounded-full ">
            <button id="open" class="w-12 h-12">➕</button>
        </div>
        <dialog id="formulaire" class="rounded-lg bg-gray-900 text-white p-6">
            <h2 class="text-lg font-bold mb-3">Ajouter une chaîne</h2>
            <p id="error" class="text-red-500 mb-2"></p>
            <form action="" class="flex flex-col gap-2">
                <label>Numéro :</label>
                <input type="text" id="num" class="text-black p-1 rounded">
                <label>Nom :</label>
                <input type="text" id="name" class="text-black p-1 rounded">
                <label>Catégorie :</label>
                <input type="text" id="category" placeholder="SPORT, CULTURE..." class="text-black p-1 rounded">
                <label>Logo (URL de l'image) :</label>
                <input type="text" id="image" class="text-black p-1 rounded">
                <button type="submit" id="btn-save"
                    class="bg-red-600 text-white rounded-lg w-full p-2 mt-2">Save</button>
                <button type="button" id="btn-close"
                    class="bg-gray-600 text-white rounded-lg w-full p-2 ">Cancel</button>
            </form>
        </dialog>
    </header>
    <!-- overflow hidden = stop scroll  -->
    <div class="flex flex-col lg:flex-row gap-12  p-12  overflow-hidden flex-1">
        <aside class="w-full lg:p-12 flex-1 p-8 border-gray-600 bg-[#111827]  rounded-2xl border-gray-600  ">
            <input id="search-input" type="search" placeholder="Recherche..."
                class="bg-gray-600 border rounded-lg w-full p-4 border-gray-800 mb-6">
            <select id="categorie-select" class="bg-gray-600 text-gray-100 rounded-lg w-full p-3 mb-4">
                <option value="all">Toutes les catégories</option>
            </select>
            <div class="flex gap-2 mb-4">
                <button id="btn-all" class="px-3 py-1 bg-red-600 text-white rounded-lg text-sm">Toutes</button>
                <button id="btn-favorites" class="px-3 py-1 bg-gray-600 text-white rounded-lg text-sm">Mes
                    Favoris</button>
                <button id="btn-blacklist" class="px-3 py-1 bg-gray-600 text-white rounded-lg text-sm">Liste
                    Noire</button>
            </div>
            <!-- overflow y-auto katkhalik t scroller up and down -->
            <div id="channels-list" class="max-h-[60vh] overflow-y-auto overflow-x-hidden">
            </div>
            <div id="message"></div>
        </aside>
        <main class="flex-1 rounded-2xl border border-gray-600 bg-[#111827] p-10">
            <div id="player-container">

                <img id="player-logo" src="" alt="channel logo" class="w-full h-full object-contain">
            </div>

            <div class="border-t border-gray-700 pt-6 mt-6">
                <h1 class="text-gray-400 text-xs font-bold uppercase mb-2 ">INFO AREA</h1>
            </div>
        </main>
    </div>

    <script src="./js/main.js" type="module"></script>

</body>

</html>
